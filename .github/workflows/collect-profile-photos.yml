name: Collect CORE profile photographs
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-profile-photos.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install image tools
        run: python3 -m pip install --user --quiet pillow requests playwright
      - name: Read the public profile provided by the owner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import requests, re, json, html, io, pathlib, shutil
          from PIL import Image, ImageOps, ImageDraw
          from playwright.sync_api import sync_playwright
          out = pathlib.Path('profile-photos'); out.mkdir()
          source = 'https://maps.app.goo.gl/jye6wsNDogomYBev6?g_st=ic'
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0'
          response = session.get(source, timeout=30)
          print('PROFILE', response.status_code, response.url, len(response.content))
          (out/'profile.html').write_text(response.text, encoding='utf-8')
          candidates = []
          def scan(text):
              text = html.unescape(text)
              for a,b in [('\\u003d','='),('\\u0026','&'),('\\u003a',':'),('\\u002f','/'),('\\/','/')]:
                  text = text.replace(a,b)
              for u in re.findall(r'https://lh[3-6]\.googleusercontent\.com/(?:p|gps-cs-s|geougc-cs|places)/[^"\\\s<>]+', text):
                  u = u.split('=')[0]
                  if u not in candidates: candidates.append(u)
          scan(response.text)
          print('INITIAL PHOTO URLS', len(candidates))
          executable = shutil.which('google-chrome') or shutil.which('chromium')
          if executable:
              with sync_playwright() as p:
                  browser = p.chromium.launch(executable_path=executable, headless=True, args=['--no-sandbox'])
                  page = browser.new_page(viewport={'width':1440,'height':1100}, locale='en-US')
                  captured = []
                  page.on('response', lambda r: captured.append(r.url))
                  try:
                      page.goto(response.url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(6000)
                      reject = page.get_by_role('button', name=re.compile('Reject all', re.I))
                      if reject.count():
                          reject.first.click(); page.wait_for_timeout(5000)
                      text = page.locator('body').inner_text()
                      print('PAGE TEXT', text[:6500])
                      (out/'page-text.txt').write_text(text, encoding='utf-8')
                      scan(page.content()); scan('\n'.join(captured))
                      buttons = page.get_by_role('button', name=re.compile('All photos|Photos of|Photo of', re.I))
                      if buttons.count():
                          buttons.first.click(timeout=5000); page.wait_for_timeout(4000)
                          scan(page.content()); scan('\n'.join(captured))
                      page.screenshot(path=str(out/'profile-screen.png'))
                      (out/'rendered.html').write_text(page.content(), encoding='utf-8')
                      print('BUTTONS', page.locator('button').evaluate_all('(els) => els.map(e=>({label:e.getAttribute("aria-label"),text:e.innerText})).slice(0,60)'))
                  except Exception as e:
                      print('BROWSER', type(e).__name__, str(e)[:250])
                  browser.close()
          records = []
          for i,u in enumerate(candidates[:16]):
              try:
                  url = u + '=w1600-h1200-k-no'
                  r = session.get(url, timeout=20); r.raise_for_status()
                  im = Image.open(io.BytesIO(r.content)); im.load()
                  if min(im.size) < 250: continue
                  name = 'photo-%02d.jpg' % (i+1)
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.save(out/name, quality=92, optimize=True)
                  records.append({'file':name,'url':url,'width':im.width,'height':im.height})
                  print('PHOTO', name, im.size, url)
              except Exception as e: print('PHOTO ERROR', i, type(e).__name__, str(e)[:100])
          (out/'sources.json').write_text(json.dumps({'profile':response.url,'photos':records,'candidates':candidates}, ensure_ascii=False, indent=2), encoding='utf-8')
          if records:
              sheet = Image.new('RGB', (1000, ((len(records)+2)//3)*270), 'white')
              draw = ImageDraw.Draw(sheet)
              for i,r in enumerate(records):
                  im = Image.open(out/r['file']); im.thumbnail((318,235))
                  x = (i%3)*333; y = (i//3)*270
                  sheet.paste(im,(x,y)); draw.text((x+5,y+240),r['file']+' '+str(r['width'])+'x'+str(r['height']),fill='black')
              sheet.save(out/'contact-sheet.jpg', quality=90)
          print('COLLECTED',len(records))
          PY
      - name: Save photographs and source references for selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-profile-photographs
          path: profile-photos/
          retention-days: 2
          if-no-files-found: error
